[project]
name = "claude-local"
dynamic = ["version"]
description = "Free local models as supervised, test-first code implementers — a deterministic red→green loop driven by Claude Code"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

# The dispatch front door. claude-protocol execs a bare `claude-local` found on PATH, so the
# console-script name IS the cross-repo contract (implementer_registry.py: executable).
[project.scripts]
claude-local = "claude_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: src/claude_local/__init__.py __version__.
# hatchling reads that literal at build time (DERIVATION_MAP: PackageVersion), so the
# package attribute and the wheel metadata can never drift.
[tool.hatch.version]
path = "src/claude_local/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root owns the benchmark package; src exposes the runtime package and tests
# exposes shared test helpers. Keep that ownership order explicit for pytest import resolution.
pythonpath = [".", "src", "tests"]
# pytest-gremlins' coverage-guided test selection under-counts kills when per-test
# coverage attribution is coarse (it judges each mutant with too few tests, reporting
# false survivors the full suite demonstrably kills). Run the full suite per mutant for
# a correct kill rate. Inert on non-mutation runs. See testing-methodology → Mutation.
addopts = ["--gremlin-no-coverage-filter"]

[dependency-groups]
# Provision the golden app once, outside the sandbox: `uv sync --group bench`.
bench = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
]
# The MLX serving stack, opt-in: `uv sync --group serve`. A GROUP, not a runtime dependency,
# for a reason that is not merely weight — mlx is Apple-silicon only, while requires-python
# ">=3.12" promises the loop installs anywhere. The loop itself only ever speaks HTTP to an
# already-listening server, so a hard dependency would make claude-local uninstallable off
# Apple silicon for the majority of its use. model_server never imports these: it spawns
# `python -m mlx_vlm.server`, so the requirement is on the interpreter's environment, not on
# an import edge, and a missing stack surfaces as the subprocess's own ModuleNotFoundError.
# mlx_vlm rather than mlx_lm: it serves the text-only models too, so one stack covers the
# whole registry, and its native prefix caching is what the stable-prefix invariant rides on.
serve = [
    "mlx-vlm>=0.6.15",
    # transformers renders a model's chat_template.jinja through jinja2 but declares it only as
    # an extra, so mlx-vlm installs without it and every chat completion 500s on the first
    # request with "apply_chat_template requires jinja2" — after the weights have loaded, so the
    # server looks healthy and readiness passes. Serving a chat model requires it; pin it here.
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "basedpyright>=1.29",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "lizard>=1.24.0",
    "pytest-gremlins>=1.9.0",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "import-linter>=2.13",
    "hypothesis>=6.165.10",
    "pytest-cov>=7.1.0",
    "grimp>=3.15",
]

[tool.ruff]
target-version = "py312"
line-length = 99
# Benchmark run artifacts: scorecard JSON and, beside it, the code each model produced. That code
# is the measurement — evidence of what a model wrote, read by a human to judge it — so linting it
# would report a weak model's style as this repository's own findings. Excluded here rather than
# left to .gitignore because a formatter or type checker is free to walk ignored paths.
#
# EVERY whole-repo analyzer needs this exclusion, not just this one: ruff here, basedpyright and
# vulture below. A new analyzer that walks the tree gets it too. The failure is not cosmetic —
# some produced files are not valid Python at all (an unclosed fence, a mangled def), so an
# analyzer without the exclusion reports a syntax error in a file this repository never wrote.
exclude = ["benchmarks/scorecards"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the test idiom; flake8-bandit's S101 targets production code, not tests.
"tests/**" = ["S101"]
# Example oracle files use the `assert` idiom (S101) and import the impl the loop
# generates into a nested `src/` after a `sys.path` insert (E402) — the oracle pattern,
# not production smells. Named `*_oracle.py`, never `test_*.py`: the impl an oracle imports
# exists only inside the loop's worktree, so a `test_` name would make the repo's own pytest
# (and the quality runner) try to collect it and fail on the missing import.
"examples/**/*_oracle.py" = ["S101", "E402"]
# Benchmark oracles are immutable pytest inputs executed only inside assembled worktrees. Some
# deliberately mutate a golden neighbor before importing the implementation to prove derivation.
"benchmarks/**/oracle.py" = ["S101", "E402"]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
# "src" for the package, "tests" for shared helpers, and the golden parent so benchmark oracles
# type-check their assembled `app` contract against its authoritative source tree.
extraPaths = [".", "src", "tests", "benchmarks/schedule_manager/golden"]
# Example oracles import generated implementations with no in-repo counterpart. Benchmark oracles
# instead resolve against the golden app above and remain fully type-checked. Benchmark run
# artifacts hold the code each model produced — the measurement itself, whose imports resolve only
# inside the case worktree that has since been torn down, so type-checking it reports a model's
# output as this repository's errors.
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  "examples/**/*_oracle.py",
  "benchmarks/scorecards",
]

[tool.vulture]
# The third whole-repo analyzer, excluded for the same reason as the two above and needing its own
# entry because each tool reads only its own: vulture parses every .py it walks, so produced code
# that is not valid Python fails it outright — reporting a weak model's unclosed fence as a finding
# here. --code-out is told to point outside this repository (D-BENCH-015) and code-*/ is git-ignored;
# this is the belt to those braces, for a caller who points it inside anyway.
exclude = ["benchmarks/scorecards"]

[tool.deptry]
# Scanned from the repo root, deptry cannot infer that this src-layout package is first-party,
# so every intra-package `from claude_local...` import reads as a transitive-dependency error
# (DEP003). Naming the package fixes it — the runtime surface is genuinely httpx-only.
known_first_party = ["claude_local"]
# Benchmark source consumes the opt-in group as regular dependencies without moving them into the
# wheel's runtime dependencies. Immutable oracles are test inputs importing an assembled `app`, so
# exclude them just as deptry's defaults exclude tests/.
non_dev_dependency_groups = ["bench"]
extend_exclude = ["benchmarks/.*/oracle\\.py"]

[tool.deptry.per_rule_ignores]
# The example oracle imports the loop-generated implementation module (`quicksort`), which by
# design exists only inside the loop's worktree, never as a declared dependency — a permanent,
# expected DEP001 for that one module name.
DEP001 = ["quicksort"]

[tool.importlinter]
# BOUNDARY_MAP.md declares the per-module import directions in prose; this layers contract is the
# mechanical enforcement of the one-way flow it documents INSIDE THE PACKAGE (orchestration →
# adapters → leaves). It does not reach the map's scripts/ rows: scripts/ is not a package and is
# not shipped, so grimp cannot graph it, and those rows are reviewed prose (D-BOUNDARY-002).
# grimp builds the STATIC import graph, so an upward import or a cycle fails the contract even when
# it would import cleanly at runtime. `exhaustive` makes an unplaced new module a hard failure, so
# the contract and the package stay in lockstep. Verified against import-linter 2.13: `|` marks
# independent siblings (a layer's modules may not import each other), which the real graph
# satisfies — no two modules in any single layer cross-import.
root_package = "claude_local"

[[tool.importlinter.contracts]]
name = "claude_local dependencies flow one way (no cycles, no upward imports)"
type = "layers"
containers = ["claude_local"]
exhaustive = true
layers = [
    # The two front doors sit above the composition root, never beside it: `__main__` is the
    # `python -m` shim over `cli`, and `cli` only adapts one invocation to a TaskSpec that
    # `entrypoint` wires. Nothing below may reach up into either.
    "__main__",
    "cli",
    # Two composition roots, siblings because neither reaches into the other: `entrypoint` wires
    # the red→green loop for a machine caller, `model_session` serves one for an interactive one.
    "entrypoint | model_session",
    "loop",
    "telemetry",
    "client | prompt | snapshot",
    "backend | derail | edits | model_server | runner",
    "harmony | model_registry | paths | sandbox | sse | types",
]
