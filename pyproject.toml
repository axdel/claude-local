[project]
name = "claude-local"
version = "0.0.1"
description = "Free local models as supervised, test-first code implementers — a deterministic red→green loop driven by claude-protocol"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# pytest-gremlins' coverage-guided test selection under-counts kills when per-test
# coverage attribution is coarse (it judges each mutant with too few tests, reporting
# false survivors the full suite demonstrably kills). Run the full suite per mutant for
# a correct kill rate. Inert on non-mutation runs. See testing-methodology → Mutation.
addopts = ["--gremlin-no-coverage-filter"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "basedpyright>=1.29",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "lizard>=1.24.0",
    "pytest-gremlins>=1.9.0",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "import-linter>=2.13",
    "hypothesis>=6.165.10",
    "pytest-cov>=7.1.0",
    "grimp>=3.15",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the test idiom; flake8-bandit's S101 targets production code, not tests.
"tests/**" = ["S101"]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
