# .claude-protocol.toml — per-project claude-protocol settings.

[peers]
enabled = []  # no external peer CLIs detected at init; claude is always implicit

[repo]
trunk = "main"
forge = "github"

[ask-patterns]
# claude-local never pulls a model on its own — confirm before any model download.
model-download = ['huggingface-cli\s+download', 'hf\s+download', 'mlx_lm\.convert', 'mlx_vlm\.convert']
