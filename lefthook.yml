# Pre-commit gate — the fast, deterministic checks every commit must pass.
#
# The registry-owned half is delegated, never restated here: `pre-commit-fast` is the quality
# registry's phase, so the tools it runs (today ruff-lint, ruff-format, and the gitleaks secret
# scan) stay under one owner and a tool added there is picked up here for free. Listing them
# inline is what silently dropped the secret scan from this gate.
#
# The two below are the project's own stricter additions, which the registry does not own.
pre-commit:
  parallel: true
  commands:
    quality-gate:
      run: claude-protocol quality run --phase pre-commit-fast
    types:
      run: uv run basedpyright
    tests:
      run: uv run --group bench pytest -q
